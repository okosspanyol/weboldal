# A weboldal felépítése és kitétele a GitHub Pagesre minden feltöltés (push) után.
# Egyszeri beállítás a GitHubon: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Weboldal kitétele (GitHub Pages)

on:
  push:
    branches:
      - main
      - claude/loving-carson-nlbm20
  # Kézi indítás: Actions fül → „Weboldal kitétele” → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy kitétel fusson; az újabb feltöltés megvárja az előzőt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Felépítés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ellenőrzés
        run: npm run check

      - name: Felépítés
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Kitétel
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
