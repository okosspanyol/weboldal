# A weboldal felépítése és kitétele a Cloudflare Workersre minden feltöltés (push) után.
# Egyszeri beállítás a GitHubon (Settings → Secrets and variables → Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   – Cloudflare API token („Edit Cloudflare Workers” sablon + D1: Edit jog)
#   CLOUDFLARE_ACCOUNT_ID  – a Cloudflare-fiók azonosítója (a Cloudflare kezelőfelületén, a Workers oldalon)
#   ADMIN_JELSZO           – az /admin felület jelszava (nem kötelező, a Cloudflare-en is megadható)
name: Weboldal kitétele (Cloudflare Workers)

on:
  push:
    branches:
      - main
      - claude/loving-carson-nlbm20
  # Kézi indítás: Actions fül → „Weboldal kitétele” → Run workflow
  workflow_dispatch:

permissions:
  contents: read

# Egyszerre csak egy kitétel fusson; az újabb feltöltés megvárja az előzőt.
concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Felépítés és kitétel
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.kitetel.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ellenőrzés
        run: npm run check

      - name: Felépítés
        run: npm run build

      - name: Cloudflare hozzáférés ellenőrzése
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Hiányzik a CLOUDFLARE_API_TOKEN vagy a CLOUDFLARE_ACCOUNT_ID GitHub Secret. Lásd README: Élesítés."
            exit 1
          fi

      - name: D1 adatbázis (létrehozás, ha még nincs)
        run: node scripts/d1-elokeszites.mjs

      - name: Adatbázis séma
        run: npx wrangler d1 migrations apply okosspanyol --remote

      - name: Kitétel
        id: kitetel
        run: |
          npx wrangler deploy | tee kitetel.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' kitetel.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Admin jelszó
        env:
          ADMIN_JELSZO: ${{ secrets.ADMIN_JELSZO }}
        run: |
          if [ -n "$ADMIN_JELSZO" ]; then
            printf '%s' "$ADMIN_JELSZO" | npx wrangler secret put ADMIN_JELSZO
          else
            echo "::notice::Nincs ADMIN_JELSZO GitHub Secret — a jelszót a Cloudflare-en add meg (lásd README)."
          fi
